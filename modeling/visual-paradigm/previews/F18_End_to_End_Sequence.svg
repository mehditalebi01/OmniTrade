ect x="843.0" y="605.0" width="414.0" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1050.0" y="622.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">7  WorkflowTask: configured definition + runtime connections</text><path d="M 1340.0 700.0 L 1435.0 700.0 L 1435.0 730.0 L 1340.0 730.0" fill="none" stroke="#E76F51" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1095.2" y="665.0" width="585.6" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1388.0" y="682.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">8  Validate graph; model budget counts actual nodes × retries (not full graph × depth)</text><path d="M 1340.0 760.0 L 1435.0 760.0 L 1435.0 790.0 L 1340.0 790.0" fill="none" stroke="#E76F51" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1171.1" y="725.0" width="433.8" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1388.0" y="742.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">9  Restore checkpoint or initialize NodeRuns; select ready wave</text><path d="M 1340.0 820.0 L 1630.0 820.0" fill="none" stroke="#E59A16" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1357.2" y="785.0" width="255.6" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1485.0" y="802.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">10  par: NodeTask × 5 fetch branches</text><path d="M 1630.0 880.0 L 1920.0 880.0" fill="none" stroke="#E59A16" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1508.6" y="845.0" width="532.8" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1775.0" y="862.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">11  real-provider-chain HTTPS; no fixture fallback; Frankfurter FX when needed</text><path d="M 1920.0 940.0 L 1630.0 940.0" fill="none" stroke="#E59A16" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1568.0" y="905.0" width="414.0" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1775.0" y="922.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">12  raw payload or classified HTTP/connection/provider error</text><path d="M 1630.0 1000.0 L 1340.0 1000.0" fill="none" stroke="#1AAE9F" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1274.7" y="965.0" width="420.6" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1485.0" y="982.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">13  EvidenceSet or safe HTTP 502 detail → remote RuntimeError</text><path d="M 1340.0 1100.0 L 1435.0 1100.0 L 1435.0 1130.0 L 1340.0 1130.0" fill="none" stroke="#E76F51" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1227.2" y="1065.0" width="321.6" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1388.0" y="1082.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">14  Join branches; time guard; checkpoint wave</text><path d="M 1340.0 1160.0 L 2210.0 1160.0" fill="none" stroke="#7B61C9" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1604.3" y="1125.0" width="341.4" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1775.0" y="1142.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">15  par: 4 typed analyst tasks with evidence refs</text><path d="M 2210.0 1220.0 L 2500.0 1220.0" fill="none" stroke="#7B61C9" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="2167.8" y="1185.0" width="374.4" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="2355.0" y="1202.0" text-anchor="middle" font-family=