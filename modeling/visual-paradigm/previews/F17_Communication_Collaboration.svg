    </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="32" y="38" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800" fill="#15233A">Figure 17 - UML communication diagram for one analysis run</text><text x="32" y="62" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#475467">Numbered messages show responsibility allocation; object links use reserved gutters and never pass through another object.</text><path d="M 460.0 245.0 L 620.0 245.0" fill="none" stroke="#4361EE" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="342.2" y="147.0" width="255.6" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="470.0" y="164.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">1 createRun(config, workflowVersion)</text><path d="M 980.0 245.0 L 1140.0 245.0" fill="none" stroke="#E59A16" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="865.5" y="147.0" width="249.0" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="990.0" y="164.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">1.1 validate(config, graph, policy)</text><path d="M 1550.0 245.0 L 1770.0 245.0" fill="none" stroke="#1AAE9F" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1437.2" y="147.0" width="255.6" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1565.0" y="164.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">1.2 persist snapshot + initial event</text><path d="M 800.0 300.0 L 800.0 510.0 L 800.0 510.0 L 800.0 650.0" fill="none" stroke="#E76F51" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="965.0" y="467.0" width="150.0" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1040.0" y="484.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">2 scheduleReady(run)</text><path d="M 980.0 705.0 L 1140.0 705.0" fill="none" stroke="#1E9E59" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="873.8" y="607.0" width="242.4" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="995.0" y="624.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">2.1 collect and normalize evidence</text><path d="M 1550.0 705.0 L 1770.0 705.0" fill="none" stroke="#7B61C9" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1445.4" y="607.0" width="229.2" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1560.0" y="624.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">2.2 execute selected specialists</text><path d="M 1345.0 650.0 L 1345.0 470.0 L 1895.0 470.0 L 1895.0 300.0 L 1975.0 300.0" fill="none" stroke="#1AAE9F" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1165.6" y="427.0" width="268.8" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1300.0" y="444.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">2.3 append ordered events + checkpoint</text><path d="M 1975.0 760.0 L 1975.0 930.0 L 1975.0 930.0 L 1975.0 1080.0" fill="none" stroke="#7B61C9" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="2101.9" y="887.0" width="196.2" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="2200.0" y="904.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">3 bounded debate + proposal</text><path d="M 1770.0 1135.0 L 1550.0 1135.0" fill="none" stroke="#E76F51" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="1437.0" y="1037.0" width="216.0" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1545.0" y="1054.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">4 apply risk policy + validate</text><path d="M 1140.