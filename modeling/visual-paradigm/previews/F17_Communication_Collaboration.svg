" y="668" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#4361EE">«lifeline»</text><text x="280.0" y="688.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">:Agent Room / Reports</text><text x="280.0" y="708.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">events, state, report, lineage</text><rect x="620" y="650" width="360" height="110" rx="11" fill="#FFF0EB" stroke="#E76F51" stroke-width="2" filter="url(#shadow)"/><text x="632" y="668" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#E76F51">«lifeline»</text><text x="800.0" y="688.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">:Readiness Scheduler</text><text x="800.0" y="708.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">stable ready set + bounded batch</text><rect x="1140" y="650" width="410" height="110" rx="11" fill="#EAF8EF" stroke="#1E9E59" stroke-width="2" filter="url(#shadow)"/><text x="1152" y="668" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#1E9E59">«lifeline»</text><text x="1345.0" y="688.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">:Evidence Gateway</text><text x="1345.0" y="708.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">real provider chains + FX + quality</text><rect x="1770" y="650" width="410" height="110" rx="11" fill="#F2EDFF" stroke="#7B61C9" stroke-width="2" filter="url(#shadow)"/><text x="1782" y="668" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#7B61C9">«lifeline»</text><text x="1975.0" y="688.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">:Specialist Pool</text><text x="1975.0" y="708.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">market/fundamental/news/sentiment</text><rect x="1770" y="1080" width="410" height="110" rx="11" fill="#F2EDFF" stroke="#7B61C9" stroke-width="2" filter="url(#shadow)"/><text x="1782" y="1098" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#7B61C9">«lifeline»</text><text x="1975.0" y="1118.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">:Debate + Proposal</text><text x="1975.0" y="1138.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">bounded control loop; protected draft</text><rect x="1140" y="1080" width="410" height="110" rx="11" fill="#FFF0EB" stroke="#E76F51" stroke-width="2" filter="url(#shadow)"/><text x="1152" y="1098" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#E76F51">«lifeline»</text><text x="1345.0" y="1118.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">:Risk + Decision</text><text x="1345.0" y="1138.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">three views + deterministic validation</text><rect x="620" y="1080" width="360" height="110" rx="11" fill="#E5F8F5" stroke="#1AAE9F" stroke-width="2" filter="url(#shadow)"/><text x="632" y="1098" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#1AAE9F">«lifeline»</text><text x="800.0" y="1118.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">:Report Builder</text><text x="800.0" y="1138.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">explanation + evidence lineage + artifacts</text><rect x="350" y="1320" width="1950" height="115" rx="11" fill="#F2F4F7" stroke="#667085" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/><text x="1325.0" y="1346.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Message contract</text><text x="1325.0" y="1366.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Every exchange carries owner_id, run_id, workflow_version_id, node/event identity, trace_id, and typed payload where applicable.</text><text x="1325.0" y="1386.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">No communication creates a brokerage order.</text></svg>