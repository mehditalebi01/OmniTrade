-size="14" font-weight="700" fill="#172033">Implemented process boundary</text><text x="1250.0" y="666.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Eight cumulative increments; stories and acceptance conditions drive work.</text><text x="1250.0" y="686.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">XP is the chosen engineering framework inside the Agile incremental process.</text></svg>