er-end="url(#arrow)"/><rect x="1362.5" y="1177.0" width="95.0" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="1410.0" y="1194.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">yes</text><path d="M 1190.0 1230.0 L 1190.0 1110.0 L 880.0 1110.0 L 880.0 405.0 L 560.0 405.0 L 560.0 450.0" fill="none" stroke="#667085" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="761.8" y="1057.0" width="176.4" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="850.0" y="1074.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">no - recompute readiness</text><path d="M 2140.0 292.5 L 2220.0 292.5 L 2220.0 1105.0 L 2250.0 1105.0 L 2250.0 1185.0" fill="none" stroke="#667085" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 2140.0 617.5 L 2240.0 617.5 L 2240.0 1125.0 L 2250.0 1125.0 L 2250.0 1185.0" fill="none" stroke="#667085" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 2140.0 1232.5 L 2175.0 1232.5 L 2175.0 1225.0 L 2210.0 1225.0" fill="none" stroke="#667085" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="80" y="120" width="100" height="80" rx="11" fill="#15233A" stroke="#15233A" stroke-width="2" filter="url(#shadow)"/><text x="92" y="138" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#15233A">«start»</text><text x="130.0" y="158.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="#172033">Start / Resume</text><rect x="300" y="100" width="520" height="125" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="312" y="118" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="560.0" y="138.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Create or restore NodeRun states</text><text x="560.0" y="158.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">completed outputs remain immutable</text><text x="560.0" y="178.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">load loop state and latest checkpoint</text><rect x="300" y="275" width="520" height="125" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="312" y="293" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="560.0" y="313.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Check cancellation signal</text><text x="560.0" y="333.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">before each batch and after each completion</text><rect x="300" y="450" width="520" height="125" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="312" y="468" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="560.0" y="488.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Compute ready set</text><text x="560.0" y="508.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">pending nodes whose required predecessors are acceptable</text><rect x="300" y="625" width="520" height="125" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="312" y="643" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="560.0" y="663.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Sort and cap batch</text><text x="560.0" y="683.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">stable node identifier</text><text x="560.0" y="703.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">max_parallel_nodes</text><rect x="300" y="800" width="520" height="125" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="312" y="818" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="560.0" y="838.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Assemble typed inputs</text><text x="560.0" y="858.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">stable edge order + execution context</text><rect x="300" y="975" width="520" height="125" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="312" y="993" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="560.0" y="1013.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Execute batch</text><text x="560.0" y="1033.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">async gather with timeout</text><text x="560.0" y="1053.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">bounded retry and real-provider fallback</text><rect x="300" y="1150" width="520" height="125" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="312" y="1168" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="560.0" y="1188.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Classify results</text><text x="560.0" y="1208.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">succeeded / degraded / failed / interrupted</text><rect x="300" y="1325" width="520" height="125" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="312" y="1343" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="560.0" y="1363.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Persist events + checkpoint</text><text x="560.0" y="1383.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">monotonic sequence</text><text x="560.0" y="1403.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">completed outputs + loop state</text><rect x="1050" y="280" width="280" height="100" rx="11" fill="#FFF4D8" stroke="#E59A16" stroke-width="2" filter="url(#shadow)"/><text x="1062" y="298" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#E59A16">«decision»</text><text x="1190.0" y="318.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Cancel requested?</text><rect x="1050" y="590" width="280" height="100" rx="11" fill="#FFF4D8" stroke="#E59A16" stroke-width="2" filter="url(#shadow)"/><text x="1062" y="608" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#E59A16">«decision»</text><text x="1190.0" y="628.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Ready set empty?</text><rect x="1050" y="1230" width="280" height="100" rx="11" fill="#FFF4D8" stroke="#E59A16" stroke-width="2" filter="url(#shadow)"/><text x="1062" y="1248" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#E59A16">«decision»</text><text x="1190.0" y="1268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Terminal?</text><rect x="1580" y="220" width="560" height="145" rx="11" fill="#E9EEFF" stroke="#4361EE" stroke-width="2" filter="url(#shadow)"/><text x="1592" y="238" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#4361EE">«state»</text><text x="1860.0" y="258.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">CANCELLED</text><text x="1860.0" y="278.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">safe cancellation point</text><text x="1860.0" y="298.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">checkpoint remains resumable</text><rect x="1580" y="545" width="560" height="145" rx="11" fill="#FFECEF" stroke="#D95367" stroke-width="2" filter="url(#shadow)"/><text x="1592" y="563" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#D95367">«state»</text><text x="1860.0" y="583.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">FAILED / INTERRUPTED</text><text x="1860.0" y="603.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">required failure or recovery process stop</text><text x="1860.0" y="623.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">stable reason and trace retained</text><rect x="1580" y="1160" width="560" height="145" rx="11" fill="#EAF8EF" stroke="#1E9E59" stroke-width="2" filter="url(#shadow)"/><text x="1592" y="1178" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#1E9E59">«state»</text><text x="1860.0" y="1198.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">COMPLETED / DEGRADED</text><text x="1860.0" y="1218.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">all required paths terminal</text><text x="1860.0" y="1238.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">optional failure may remain with warning</text><rect x="2210" y="1185" width="80" height="80" rx="11" fill="#15233A" stroke="#15233A" stroke-width="2" filter="url(#shadow)"/><text x="2222" y="1203" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#15233A">«end»</text><text x="2250.0" y="1223.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="700" fill="#172033">End</text><rect x="1280" y="1430" width="950" height="130" rx="11" fill="#F2F4F7" stroke="#667085" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/><text x="1755.0" y="1456.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Resume invariant</text><text x="1755.0" y="1476.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Resume loads the latest checkpoint, keeps completed outputs, resets incomplete states to pending, and re-enters readiness.</text><text x="1755.0" y="1496.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Declared loop state is restored; completed nodes are not repeated.</text></svg>