      <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="32" y="38" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800" fill="#15233A">Figure 3 - XP verification and Continuous Integration pipeline</text><text x="32" y="62" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#475467">Compact two-row pipeline: fast feedback before integration and inspectable evidence after a green main branch.</text><rect x="80" y="550" width="2040" height="280" rx="14" fill="#FCFCFD" fill-opacity="0.42" stroke="#667085" stroke-width="2"/><rect x="94" y="537" width="147.6" height="26" rx="6" fill="#FFFFFF" stroke="#667085"/><text x="104" y="555" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="750" fill="#667085">Verification gates</text><path d="M 490.0 167.5 L 590.0 167.5" fill="none" stroke="#667085" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 980.0 167.5 L 1080.0 167.5" fill="none" stroke="#667085" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1470.0 167.5 L 1570.0 167.5" fill="none" stroke="#667085" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1765.0 235.0 L 1765.0 330.0" fill="none" stroke="#667085" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1570.0 397.5 L 1470.0 397.5" fill="none" stroke="#667085" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1080.0 397.5 L 980.0 397.5" fill="none" stroke="#667085" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 590.0 397.5 L 490.0 397.5" fill="none" stroke="#667085" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 100.0 397.5 L 45.0 397.5 L 45.0 45.0 L 295.0 45.0 L 295.0 100.0" fill="none" stroke="#4361EE" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="444.1" y="17.0" width="631.8" height="26" rx="5" fill="#FFFFFF" stroke="#D0D5DD"/><text x="760.0" y="34.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="11" fill="#475467">failed gate returns to the smallest responsible change; green baseline informs the next story</text><rect x="100" y="100" width="390" height="135" rx="11" fill="#E9EEFF" stroke="#4361EE" stroke-width="2" filter="url(#shadow)"/><text x="112" y="118" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#4361EE">«activity»</text><text x="295.0" y="138.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Story + acceptance</text><text x="295.0" y="158.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">observable behavior</text><text x="295.0" y="178.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">contract impact</text><rect x="590" y="100" width="390" height="135" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="602" y="118" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="785.0" y="138.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Lead + reviewer</text><text x="785.0" y="158.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">small change</text><text x="785.0" y="178.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">shared ownership</text><rect x="1080" y="100" width="390" height="135" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="1092" y="118" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="1275.0" y="138.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Unit + contract tests</text><text x="1275.0" y="158.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">validator, runtime, providers</text><text x="1275.0" y="178.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">reports and configuration matrix</text><rect x="1570" y="100" width="390" height="135" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="1582" y="118" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="1765.0" y="138.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Static checks</text><text x="1765.0" y="158.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Ruff + mypy</text><text x="1765.0" y="178.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">TypeScript checks</text><rect x="1570" y="330" width="390" height="135" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="1582" y="348" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="1765.0" y="368.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Integration tests</text><text x="1765.0" y="388.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">API, storage, events</text><text x="1765.0" y="408.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">checkpoint recovery</text><rect x="1080" y="330" width="390" height="135" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="1092" y="348" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="1275.0" y="368.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Frontend verification</text><text x="1275.0" y="388.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Vitest + production build</text><text x="1275.0" y="408.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Playwright smoke path</text><rect x="590" y="330" width="390" height="135" rx="11" fill="#FFFFFF" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="602" y="348" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«activity»</text><text x="785.0" y="368.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Container checks</text><text x="785.0" y="388.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Compose configuration</text><text x="785.0" y="408.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">health + migration startup</text><rect x="100" y="330" width="390" height="135" rx="11" fill="#E9EEFF" stroke="#4361EE" stroke-width="2" filter="url(#shadow)"/><text x="112" y="348" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#4361EE">«activity»</text><text x="295.0" y="368.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Integrated baseline</text><text x="295.0" y="388.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">review evidence</text><text x="295.0" y="408.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">next story feedback</text><rect x="130" y="630" width="380" height="110" rx="11" fill="#FFFFFF" stroke="#98A2B3" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/><text x="320.0" y="656.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Fast feedback</text><text x="320.0" y="676.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Unit or contract failure</text><text x="320.0" y="696.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">stops the change.</text><rect x="650" y="630" width="380" height="110" rx="11" fill="#FFFFFF" stroke="#98A2B3" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/><text x="840.0" y="656.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Deterministic boundary</text><text x="840.0" y="676.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Recorded providers + fake models</text><text x="840.0" y="696.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">remove live-service variance.</text><rect x="1170" y="630" width="380" height="110" rx="11" fill="#FFFFFF" stroke="#98A2B3" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/><text x="1360.0" y="656.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Regression control</text><text x="1360.0" y="676.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Configuration matrix covers</text><text x="1360.0" y="696.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">options and provider chains.</text><rect x="1690" y="630" width="380" height="110" rx="11" fill="#FFFFFF" stroke="#98A2B3" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/><text x="1880.0" y="656.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Release evidence</text><text x="1880.0" y="676.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Build, containers, migrations,</text><text x="1880.0" y="696.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">and scenario artifacts stay inspectable.</text><rect x="330" y="920" width="1540" height="100" rx="11" fill="#F2F4F7" stroke="#667085" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow)"/><text x="1100.0" y="946.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Evidence boundary</text><text x="1100.0" y="966.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">The repository proves automated checks and reproducible configuration.</text><text x="1100.0" y="986.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">It does not claim that every historical decision was test-first.</text></svg>