    </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="32" y="38" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800" fill="#15233A">Architecture 5 - Architecture principles and quality-attribute traceability</text><text x="32" y="62" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#475467">Principles are expressed as enforceable implementation rules, not slogans; each group ends in the quality attributes it protects.</text><rect x="60" y="105" width="815" height="1810" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#4361EE" stroke-width="2"/><rect x="74" y="92" width="213.2" height="26" rx="6" fill="#FFFFFF" stroke="#4361EE"/><text x="84" y="110" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="750" fill="#4361EE">Structure and evolvability</text><rect x="945" y="105" width="815" height="1810" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#1E9E59" stroke-width="2"/><rect x="959" y="92" width="221.39999999999998" height="26" rx="6" fill="#FFFFFF" stroke="#1E9E59"/><text x="969" y="110" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="750" fill="#1E9E59">Correctness and determinism</text><rect x="1830" y="105" width="815" height="1810" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#E76F51" stroke-width="2"/><rect x="1844" y="92" width="204.99999999999997" height="26" rx="6" fill="#FFFFFF" stroke="#E76F51"/><text x="1854" y="110" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="750" fill="#E76F51">Resilience and operations</text><rect x="2715" y="105" width="815" height="1810" rx="14" fill="#FFFFFF" fill-opacity="0.42" stroke="#D95367" stroke-width="2"/><rect x="2729" y="92" width="245.99999999999997" height="26" rx="6" fill="#FFFFFF" stroke="#D95367"/><text x="2739" y="110" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="750" fill="#D95367">Trust, safety, and explanation</text><path d="M 467.5 455.0 L 467.5 520.0 L 95.0 520.0 L 95.0 1632.5 L 130.0 1632.5" fill