oke-width="2" filter="url(#shadow)"/><text x="142" y="1073" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#4361EE">«component»</text><text x="467.5" y="1093.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Dependency inversion</text><text x="467.5" y="1113.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Provider and ModelClient protocols isolate vendors</text><text x="467.5" y="1133.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">source: providers.py + model_gateway.py</text><rect x="130" y="1510" width="675" height="245" rx="11" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="142" y="1528" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«component»</text><text x="467.5" y="1548.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Structure and evolvability quality outcomes</text><text x="467.5" y="1568.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Maintainability | replaceability | testability</text><text x="467.5" y="1588.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">verified by tests, events, and artifacts</text><rect x="1015" y="215" width="675" height="240" rx="11" fill="#EAF8EF" stroke="#1E9E59" stroke-width="2" filter="url(#shadow)"/><text x="1027" y="233" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#1E9E59">«component»</text><text x="1352.5" y="253.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Explicit contracts</text><text x="1352.5" y="273.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Pydantic models + typed ports reject invalid graphs/data</text><text x="1352.5" y="293.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">source: contracts.py + validator.py</text><rect x="1015" y="635" width="675" height="240" rx="11" fill="#EAF8EF" stroke="#1E9E59" stroke-width="2" filter="url(#shadow)"/><text x="1027" y="653" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#1E9E59">«component»</text><text x="1352.5" y="673.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Deterministic control</text><text x="1352.5" y="693.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">stable ready-set ordering and owned decision checks</text><text x="1352.5" y="713.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">source: runtime.py + executors.py</text><rect x="1015" y="1055" width="675" height="240" rx="11" fill="#EAF8EF" stroke="#1E9E59" stroke-width="2" filter="url(#shadow)"/><text x="1027" y="1073" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#1E9E59">«component»</text><text x="1352.5" y="1093.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Immutable execution context</text><text x="1352.5" y="1113.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">published version and InvestorPolicy copied into Run</text><text x="1352.5" y="1133.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">source: storage.py + api.py</text><rect x="1015" y="1510" width="675" height="245" rx="11" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="1027" y="1528" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«component»</text><text x="1352.5" y="1548.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Correctness and determinism quality outcomes</text><text x="1352.5" y="1568.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Consistency | reproducibility | auditability</text><text x="1352.5" y="1588.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">verified by tests, events, and artifacts</text><rect x="1900" y="215" width="675" height="240" rx="11" fill="#FFF0EB" stroke="#E76F51" stroke-width="2" filter="url(#shadow)"/><text x="1912" y="233" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#E76F51">«component»</text><text x="2237.5" y="253.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Bound every resource</text><text x="2237.5" y="273.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">timeouts, retries, budgets, parallel and loop limits</text><text x="2237.5" y="293.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">source: Budget + RetryPolicy + bounded_loop</text><rect x="1900" y="635" width="675" height="240" rx="11" fill="#FFF0EB" stroke="#E76F51" stroke-width="2" filter="url(#shadow)"/><text x="1912" y="653" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#E76F51">«component»</text><text x="2237.5" y="673.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Fail explicitly and degrade safely</text><text x="2237.5" y="693.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">required failure stops; optional failure records warning</text><text x="2237.5" y="713.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">source: FailurePolicy + WorkflowRuntime</text><rect x="1900" y="1055" width="675" height="240" rx="11" fill="#FFF0EB" stroke="#E76F51" stroke-width="2" filter="url(#shadow)"/><text x="1912" y="1073" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#E76F51">«component»</text><text x="2237.5" y="1093.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Make progress resumable</text><text x="2237.5" y="1113.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">events + checkpoints + consumed IDs avoid duplicate work</text><text x="2237.5" y="1133.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">source: _checkpoint() + resume_run()</text><rect x="1900" y="1510" width="675" height="245" rx="11" fill="#F2F4F7" stroke="#667085" stroke-width="2" filter="url(#shadow)"/><text x="1912" y="1528" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#667085">«component»</text><text x="2237.5" y="1548.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Resilience and operations quality outcomes</text><text x="2237.5" y="1568.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Availability | recoverability | predictable cost</text><text x="2237.5" y="1588.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">verified by tests, events, and artifacts</text><rect x="2785" y="215" width="675" height="240" rx="11" fill="#FFECEF" stroke="#D95367" stroke-width="2" filter="url(#shadow)"/><text x="2797" y="233" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#D95367">«component»</text><text x="3122.5" y="253.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Least-privilege secrets</text><text x="3122.5" y="273.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">verified credentials stay in memory and are task-scoped</text><text x="3122.5" y="293.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">source: SessionConnectionStore + remote_executor</text><rect x="2785" y="635" width="675" height="240" rx="11" fill="#FFECEF" stroke="#D95367" stroke-width="2" filter="url(#shadow)"/><text x="2797" y="653" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#D95367">«component»</text><text x="3122.5" y="673.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Ground and protect decisions</text><text x="3122.5" y="693.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">models cannot overwrite evidence/action/confidence fields</text><text x="3122.5" y="713.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">source: merge_model_narrative()</text><rect x="2785" y="1055" width="675" height="240" rx="11" fill="#FFECEF" stroke="#D95367" stroke-width="2" filter="url(#shadow)"/><text x="2797" y="1073" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#D95367">«component»</text><text x="3122.5" y="1093.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Preserve safety boundary</text><text x="3122.5" y="1113.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">decision support, lineage, disclaimer; no broker interface</text><text x="3122.5" y="1133.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">source: reporting.py + architecture ADRs</text><rect x="2785" y="1510" width="675" height="245" rx="11" fill="#F2F4F7" stroke="#667085" stroke-width="