<svg xmlns="http://www.w3.org/2000/svg" width="3400" height="1830" viewBox="0 0 3400 1830">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L10,4 L0,8 z" fill="context-stroke"/>
      </marker>
      <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    </defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="32" y="38" font-family="Inter,Segoe UI,Arial" font-size="24" font-weight="800" fill="#15233A">Architecture 3 - Dominant and supporting architectural styles</text><text x="32" y="62" font-family="Inter,Segoe UI,Arial" font-size="13" fill="#475467">Dominant style: layered web information system. Supporting styles refine distribution, workflow computation, event observation, and durable information ownership.</text><rect x="60" y="105" width="2180" height="1620" rx="14" fill="#F8FAFF" fill-opacity="0.42" stroke="#4361EE" stroke-width="2"/><rect x="74" y="92" width="377.2" height="26" rx="6" fill="#FFFFFF" stroke="#4361EE"/><text x="84" y="110" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="750" fill="#4361EE">Dominant style: Layered web information system</text><rect x="2350" y="105" width="990" height="1620" rx="14" fill="#FAF8FF" fill-opacity="0.42" stroke="#7B61C9" stroke-width="2"/><rect x="2364" y="92" width="491.99999999999994" height="26" rx="6" fill="#FFFFFF" stroke="#7B61C9"/><text x="2374" y="110" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="750" fill="#7B61C9">Supporting styles - scoped, not competing main architectures</text><path d="M 1140.0 380.0 L 1140.0 417.5 L 1140.0 417.5 L 1140.0 455.0" fill="none" stroke="#4361EE" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1140.0 645.0 L 1140.0 682.5 L 1140.0 682.5 L 1140.0 720.0" fill="none" stroke="#4361EE" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1140.0 910.0 L 1140.0 947.5 L 1140.0 947.5 L 1140.0 985.0" fill="none" stroke="#4361EE" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1140.0 1175.0 L 1140.0 1212.5 L 1140.0 1212.5 L 1140.0 1250.0" fill="none" stroke="#4361EE" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 2110.0 285.0 L 2470.0 285.0" fill="none" stroke="#2D9CDB" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 2110.0 550.0 L 2470.0 550.0" fill="none" stroke="#4361EE" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 2110.0 815.0 L 2470.0 815.0" fill="none" stroke="#1E9E59" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 2110.0 1080.0 L 2470.0 1080.0" fill="none" stroke="#E76F51" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 2110.0 1345.0 L 2470.0 1345.0" fill="none" stroke="#7B61C9" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="170" y="190" width="1940" height="190" rx="11" fill="#E9EEFF" stroke="#4361EE" stroke-width="2" filter="url(#shadow)"/><text x="182" y="208" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#4361EE">«component»</text><text x="1140.0" y="228.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Layer 1 - User interface</text><text x="1140.0" y="248.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">React pages and workflow canvas</text><text x="1140.0" y="268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">renders commands, progress, reports</text><text x="1140.0" y="288.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">client/browser responsibility</text><rect x="170" y="455" width="1940" height="190" rx="11" fill="#E8F7FF" stroke="#2D9CDB" stroke-width="2" filter="url(#shadow)"/><text x="182" y="473" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#2D9CDB">«component»</text><text x="1140.0" y="493.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Layer 2 - User communications and access</text><text x="1140.0" y="513.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Nginx + FastAPI REST/SSE</text><text x="1140.0" y="533.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">JWT ownership; DTO and connection checks</text><text x="1140.0" y="553.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">network-facing boundary</text><rect x="170" y="720" width="1940" height="190" rx="11" fill="#FFF0EB" stroke="#E76F51" stroke-width="2" filter="url(#shadow)"/><text x="182" y="738" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#E76F51">«component»</text><text x="1140.0" y="758.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Layer 3 - Application and CONTROL services</text><text x="1140.0" y="778.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">run composition + workflow scheduling + governance</text><text x="1140.0" y="798.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">API, workflow, evidence, model, report services</text><text x="1140.0" y="818.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">application-specific coordination</text><rect x="170" y="985" width="1940" height="190" rx="11" fill="#EAF8EF" stroke="#1E9E59" stroke-width="2" filter="url(#shadow)"/><text x="182" y="1003" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#1E9E59">«component»</text><text x="1140.0" y="1023.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Layer 4 - Information retrieval and domain processing</text><text x="1140.0" y="1043.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">provider adapters, normalization, calculations</text><text x="1140.0" y="1063.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">specialists, bounded research, risk, decision</text><text x="1140.0" y="1083.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">typed pipeline transformations</text><rect x="170" y="1250" width="1940" height="190" rx="11" fill="#F2EDFF" stroke="#7B61C9" stroke-width="2" filter="url(#shadow)"/><text x="182" y="1268" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#7B61C9">«component»</text><text x="1140.0" y="1288.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Layer 5 - Durable information management</text><text x="1140.0" y="1308.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">PostgreSQL + Redis Streams + artifacts</text><text x="1140.0" y="1328.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">versioned workflows, runs, events, evidence, reports</text><text x="1140.0" y="1348.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">repository and recovery state</text><rect x="2470" y="190" width="750" height="190" rx="11" fill="#E8F7FF" stroke="#2D9CDB" stroke-width="2" filter="url(#shadow)"/><text x="2482" y="208" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#2D9CDB">«component»</text><text x="2845.0" y="228.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Client-server</text><text x="2845.0" y="248.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">browser client -&gt; HTTP/SSE servers</text><text x="2845.0" y="268.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Docker services may share one host</text><text x="2845.0" y="288.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">scope: distribution and communication</text><rect x="2470" y="455" width="750" height="190" rx="11" fill="#E9EEFF" stroke="#4361EE" stroke-width="2" filter="url(#shadow)"/><text x="2482" y="473" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#4361EE">«component»</text><text x="2845.0" y="493.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Service-oriented</text><text x="2845.0" y="513.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">five cohesive backend services</text><text x="2845.0" y="533.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">versioned DTOs; internal HTTP contracts</text><text x="2845.0" y="553.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">scope: application responsibility</text><rect x="2470" y="720" width="750" height="190" rx="11" fill="#EAF8EF" stroke="#1E9E59" stroke-width="2" filter="url(#shadow)"/><text x="2482" y="738" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#1E9E59">«component»</text><text x="2845.0" y="758.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Pipes and filters</text><text x="2845.0" y="778.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">typed DAG nodes transform port values</text><text x="2845.0" y="798.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">parallel branches, joins, bounded loop</text><text x="2845.0" y="818.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">scope: analysis computation</text><rect x="2470" y="985" width="750" height="190" rx="11" fill="#FFF0EB" stroke="#E76F51" stroke-width="2" filter="url(#shadow)"/><text x="2482" y="1003" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#E76F51">«component»</text><text x="2845.0" y="1023.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Event-driven / implicit invocation</text><text x="2845.0" y="1043.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">runtime publishes versioned RunEvents</text><text x="2845.0" y="1063.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">UI and recovery observe without owning schedule</text><text x="2845.0" y="1083.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">scope: progress and control signals</text><rect x="2470" y="1250" width="750" height="190" rx="11" fill="#F2EDFF" stroke="#7B61C9" stroke-width="2" filter="url(#shadow)"/><text x="2482" y="1268" font-family="Inter,Segoe UI,Arial" font-size="10" fill="#7B61C9">«component»</text><text x="2845.0" y="1288.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="700" fill="#172033">Repository</text><text x="2845.0" y="1308.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">durable shared facts in PostgreSQL</text><text x="2845.0" y="1328.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">Redis event log + hashed artifact archive</text><text x="2845.0" y="1348.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial" font-size="13" font-weight="430" fill="#172033">scope: state, audit, recovery</text></svg>