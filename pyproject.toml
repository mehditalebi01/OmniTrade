[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnitrade-ai"
version = "0.1.0"
description = "Visual event-driven stock decision-support workflow engine"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.9,<3",
  "redis>=5.2,<6",
  "reportlab>=4.2,<5",
  "sqlalchemy>=2.0,<3",
  "sse-starlette>=2.1,<3",
  "uvicorn[standard]>=0.32,<1",
  "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.115,<7",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "pypdf>=5,<6",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["omnitrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=omnitrade.engine --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "pypdf.*"]
ignore_missing_imports = true
